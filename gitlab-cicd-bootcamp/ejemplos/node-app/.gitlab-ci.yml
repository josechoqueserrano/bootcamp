# GitLab CI/CD Pipeline para aplicación Node.js
# Este archivo demuestra conceptos básicos a avanzados de CI/CD

stages:
  - install
  - lint
  - test
  - security
  - build
  - deploy

# Variables globales
variables:
  NODE_VERSION: "16"
  NPM_CONFIG_CACHE: ".npm"
  DOCKER_REGISTRY: "$CI_REGISTRY"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE"

# Cache para optimizar builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/

# ============================================================================
# STAGE: INSTALL - Instalación de dependencias
# ============================================================================

install_dependencies:
  stage: install
  image: node:$NODE_VERSION
  before_script:
    - echo "Node.js version $(node --version)"
    - echo "npm version $(npm --version)"
  script:
    - npm ci --cache .npm --prefer-offline
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour
    reports:
      dotenv: build.env
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ============================================================================
# STAGE: LINT - Análisis de código estático
# ============================================================================

lint_code:
  stage: lint
  image: node:$NODE_VERSION
  script:
    - npm run lint
  dependencies:
    - install_dependencies
  artifacts:
    reports:
      junit: eslint-report.xml
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ============================================================================
# STAGE: TEST - Pruebas automatizadas
# ============================================================================

unit_tests:
  stage: test
  image: node:$NODE_VERSION
  script:
    - npm run test:unit
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week
  dependencies:
    - install_dependencies
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

integration_tests:
  stage: test
  image: node:$NODE_VERSION
  script:
    - npm run test:integration
  artifacts:
    reports:
      junit: integration-junit.xml
  dependencies:
    - install_dependencies
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ============================================================================
# STAGE: SECURITY - Análisis de seguridad
# ============================================================================

security_audit:
  stage: security
  image: node:$NODE_VERSION
  script:
    - npm audit --audit-level=moderate
  dependencies:
    - install_dependencies
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ============================================================================
# STAGE: BUILD - Construcción de la aplicación
# ============================================================================

build_application:
  stage: build
  image: node:$NODE_VERSION
  script:
    - echo "Building application..."
    - npm run build
    - echo "Build completed successfully"
  artifacts:
    name: "build-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 1 week
  dependencies:
    - install_dependencies
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG

# Build Docker image (solo en branches principales y tags)
build_docker_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_SHA .
    - docker build -t $DOCKER_IMAGE:latest .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHA
    - docker push $DOCKER_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# ============================================================================
# STAGE: DEPLOY - Despliegue de la aplicación
# ============================================================================

deploy_staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deploying to staging environment..."
    - echo "Application URL: https://staging-$CI_PROJECT_NAME.example.com"
    - echo "Deployment completed"
  environment:
    name: staging
    url: https://staging-$CI_PROJECT_NAME.example.com
    deployment_tier: staging
  dependencies:
    - build_application
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deploying to production environment..."
    - echo "Application URL: https://$CI_PROJECT_NAME.example.com"
    - echo "Production deployment completed"
  environment:
    name: production
    url: https://$CI_PROJECT_NAME.example.com
    deployment_tier: production
  dependencies:
    - build_application
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - if: $CI_COMMIT_TAG
      when: manual

# ============================================================================
# JOBS ESPECIALES
# ============================================================================

# Job que se ejecuta solo en merge requests
merge_request_checks:
  stage: test
  image: node:$NODE_VERSION
  script:
    - echo "Ejecutando verificaciones específicas para Merge Request"
    - npm run lint
    - npm run test:unit
  dependencies:
    - install_dependencies
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Job de limpieza que siempre se ejecuta
cleanup:
  stage: .post
  image: alpine:latest
  script:
    - echo "Cleaning up temporary files..."
    - echo "Pipeline completed"
  when: always
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ============================================================================
# EJEMPLO DE JOBS PARALELOS
# ============================================================================

# Estos jobs se ejecutan en paralelo dentro del mismo stage
parallel_job_1:
  stage: test
  image: node:$NODE_VERSION
  script:
    - echo "Ejecutando job paralelo 1"
    - sleep 10
  parallel: 3
  dependencies:
    - install_dependencies
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================================================
# EJEMPLO DE MATRIX BUILDS
# ============================================================================

test_multiple_node_versions:
  stage: test
  image: node:$NODE_VERSION_MATRIX
  script:
    - node --version
    - npm --version
    - npm ci
    - npm test
  parallel:
    matrix:
      - NODE_VERSION_MATRIX: ["14", "16", "18"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual